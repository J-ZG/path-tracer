[package]
name = "path-tracer"
version = "0.1.0"
resolver = "3"
edition = "2024"
description = "Demo Rust wgpu interactive path tracer."
repository = "https://github.com/0dpe/path-tracer"
readme = "README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# avoid "the bin target the bin target `path-tracer` in package `path-tracer v0.1.0 ()` has the same output filename as the lib target `path-tracer` in package `path-tracer v0.1.0 ()`
[[bin]]
name = "path-tracer-app"
path = "src/main.rs"

[features]
testing = [
    "dep:image",
    "dep:serde",
    "dep:serde-saphyr",
    "dep:wgpu-profiler",
    "dep:tracy-client",
]

[[bench]]
name = "scene_bench"
harness = false
bench = false        # so code in benches/ doesn't error when working with wasm32

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"

[dependencies]
wgpu = "29.0.4"
winit = "0.30.13"
gltf = { version = "1.4.1", features = [
    "KHR_materials_specular",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "extras",
] }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.33.2", features = ["bytemuck", "serde"] }
web-time = "1.1.0"
guillotiere = "0.7.0"
bevy_mikktspace = { version = "1.0.0", features = ["corrected-edge-sorting"] }
serde_json = "1.0.151"
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui_extras = { version = "0.35.0", features = ["svg"] }
log = "0.4.33"
anyhow = "1.0.104"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    # for getting the .glb file on the web, in src/render/scene.rs 
    "Response",
    # for logger.rs
    "CustomEvent",
    "CustomEventInit",
    # more features are used, but other crates enabled them already
] }
js-sys = "0.3.103"
egui-winit = { version = "0.35.0", default-features = false, features = [
    "links",
] } # clipboard feature isn't supported on WASM

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
egui-winit = { version = "0.35.0", default-features = false, features = [
    "clipboard",
    "links",
] } # clipboard feature works on native
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, optional = true }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde-saphyr = { version = "1.0.0", default-features = false, features = [
    "serialize",
], optional = true }
wgpu-profiler = { version = "0.27.0", optional = true, features = ["tracy"] }
tracy-client = { version = "0.18.4", optional = true }


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes = "allow" # can be "warn"
decimal_literal_representation = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
too_many_arguments = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
too_many_lines = "allow"
default_trait_access = "allow"
trivially_copy_pass_by_ref = "allow"
items_after_statements = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_field_names = "allow"
