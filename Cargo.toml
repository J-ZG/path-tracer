[package]
name = "path-tracer"
version = "0.1.0"
resolver = "3"
edition = "2024"
description = "Demo Rust wgpu interactive path tracer."
repository = "https://github.com/j-zg/path-tracer"
readme = "README.md"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# avoid "the bin target `path-tracer` in package `path-tracer v0.1.0 ()` has the same output filename as the lib target `path-tracer` in package `path-tracer v0.1.0 ()`"
[[bin]]
name = "path-tracer-app"
path = "src/main.rs"

[features]
testing = [
    "dep:serde",
    "dep:serde-saphyr",
    "dep:wgpu-profiler",
    "dep:tracy-client",
]

[[bench]]
name = "world_bench"
harness = false
bench = false        # so code in benches/ doesn't error when working with wasm32

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
    "plotters",
] }

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = [
    "dx12",
    "metal",
    "vulkan",
    "webgpu",
    "wgsl",
    "parking_lot",
    "std",
] }
winit = { version = "0.30.13", default-features = false, features = [
    "wayland",
    "x11",
    "wayland-csd-adwaita",
    "wayland-dlopen",
    "rwh_06",
] }
rfd = { version = "0.17.2", default-features = false, features = [
    "wayland",
    "xdg-portal",
] }
gltf = { version = "1.4.1", default-features = false, features = [
    "import",
    "utils",
    "KHR_materials_specular",
    "KHR_materials_emissive_strength",
    "KHR_materials_ior",
    "extras",
] }
image = { version = "0.25.10", default-features = false, features = [
    "exr",
    "hdr",
    "jpeg",
    "png",
    "webp",
] }
bytemuck = { version = "1.25.2", default-features = false, features = [
    "derive",
] }
glam = { version = "0.34.2", default-features = false, features = [
    "std",
    "all-types",
    "bytemuck",
    "serde",
] }
web-time = { version = "1.1.0", default-features = false }
guillotiere = { version = "0.7.0", default-features = false }
bevy_mikktspace = { version = "1.0.0", default-features = false, features = [
    "std",
    "corrected-edge-sorting",
] }
serde_json = { version = "1.0.154", default-features = false }
egui = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", default-features = false, features = [
    "svg",
] }
log = { version = "0.4.35", default-features = false }
anyhow = { version = "1.0.104", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.130", default-features = false }
wasm-bindgen-futures = { version = "0.4.80", default-features = false }
web-sys = { version = "0.3.107", default-features = false, features = [
    # for egui keyboard shortcuts and text copying on the web
    "Clipboard",
    "Navigator",
    # for getting the .glb file on the web 
    "Response",
    # for logger.rs
    "CustomEvent",
    "CustomEventInit",
    # more features are used, but other crates enabled them already
] }
js-sys = { version = "0.3.107", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = [
    "links",
] } # browser clipboard writes are handled in State::update

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "1.0.1", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "links",
] } # clipboard feature works on native
env_logger = { version = "0.11.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive",
], optional = true }
serde-saphyr = { version = "2.0.0", default-features = false, features = [
    "serialize",
], optional = true }
wgpu-profiler = { version = "0.28.0", default-features = false, features = [
    "tracy",
], optional = true }
tracy-client = { version = "0.19.0", optional = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes = "allow"                   # can be "warn"
decimal_literal_representation = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
expect_used = "deny"
unwrap_used = "deny"
panic = "deny"
too_many_arguments = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
too_many_lines = "allow"
default_trait_access = "allow"
trivially_copy_pass_by_ref = "allow"
items_after_statements = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_field_names = "allow"

# temporary compatibility patches
[patch.crates-io]
wgpu-profiler = { path = "vendor/wgpu-profiler" }
