<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Tracer</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #rust-insert-wasm {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        #bottom-right-logs {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 400px;
            max-height: 200px;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.6);
            color: rgb(255, 255, 255);
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            border-radius: 4px;
            z-index: 5;
            display: none;
            opacity: 1;
            transition: opacity 2s ease;
            box-sizing: border-box;
        }

        #bottom-right-logs.is-fading {
            opacity: 0;
        }

        #bottom-right-logs.is-faded {
            pointer-events: none;
        }

        #bottom-right-logs.is-hovered {
            opacity: 1;
            transition: none;
        }

        #close-logs {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font: 16px/20px sans-serif;
            opacity: 0.8;
        }

        #close-logs:hover {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        #loading-screen {
            background-color: #111;
            color: #fff;
            z-index: 10;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loading-logs {
            margin-top: 20px;
            width: 80%;
            max-width: 800px;
            height: 200px;
            overflow-y: auto;
            background: #000;
            color: #ddd;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
        }

        #error-display {
            background-color: rgba(20, 0, 0, 0.85);
            color: #ff6666;
            z-index: 20;
            display: none;
        }

        #error-box {
            background: #220000;
            padding: 30px;
            border: 1px solid #ff0000;
            border-radius: 8px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        #error-box h1 {
            margin-top: 0;
            color: #ff3333;
        }

        #error-message {
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <canvas id="rust-insert-wasm"></canvas>

    <div id="bottom-right-logs">
        <button id="close-logs" type="button" aria-label="Close logs">&times;</button>
    </div>

    <div id="loading-screen" class="overlay">
        <div class="spinner"></div>
        <h2>Loading Path Tracer...</h2>
        <div id="loading-logs"></div>
    </div>

    <div id="error-display" class="overlay">
        <div id="error-box">
            <h1>Fatal Error</h1>
            <div id="error-message"></div>
        </div>
    </div>

    <script type="module">
        import init from "./pkg/path_tracer.js";

        const loadingScreen = document.getElementById("loading-screen");
        const loadingLogs = document.getElementById("loading-logs");
        const bottomRightLogs = document.getElementById("bottom-right-logs");
        const errorDisplay = document.getElementById("error-display");
        const errorMessage = document.getElementById("error-message");
        const closeLogs = document.getElementById("close-logs");

        let presentedFirstFrame = false;
        let logsAreHovered = false;
        let hideLogsTimer;

        function resetLogFade() {
            clearTimeout(hideLogsTimer);
            bottomRightLogs.classList.remove("is-fading");

            if (!logsAreHovered) {
                hideLogsTimer = setTimeout(() => {
                    if (!logsAreHovered) {
                        bottomRightLogs.classList.add("is-fading");
                    }
                }, 5000);
            }
        }

        bottomRightLogs.addEventListener("transitionend", (event) => {
            if (event.propertyName === "opacity" && bottomRightLogs.classList.contains("is-fading") && !logsAreHovered) {
                bottomRightLogs.classList.add("is-faded");
            }
        });

        bottomRightLogs.addEventListener("mouseenter", () => {
            logsAreHovered = true;
            clearTimeout(hideLogsTimer);
            bottomRightLogs.classList.add("is-hovered");
            bottomRightLogs.classList.remove("is-fading");
        });

        bottomRightLogs.addEventListener("mouseleave", () => {
            logsAreHovered = false;
            bottomRightLogs.classList.remove("is-hovered");
            if (!bottomRightLogs.classList.contains("is-faded")) {
                resetLogFade();
            }
        });

        closeLogs.addEventListener("click", () => {
            clearTimeout(hideLogsTimer);
            bottomRightLogs.style.display = "none";
            bottomRightLogs.classList.remove("is-hovered");
            bottomRightLogs.classList.remove("is-fading");
            bottomRightLogs.classList.remove("is-faded");
        });

        function showError(msg) {
            errorDisplay.style.display = "flex";
            errorMessage.textContent = msg;
        }

        function handleLog(msg) {
            const logLine = document.createElement("div");
            logLine.textContent = msg;

            if (!presentedFirstFrame) {
                // still loading, put logs in the central loading logs
                loadingLogs.appendChild(logLine);
                loadingLogs.scrollTop = loadingLogs.scrollHeight; // auto-scroll to bottom
            } else {
                // the canvas is visible, put logs in the small bottom-right overlay
                bottomRightLogs.style.display = "block"; // Make sure it's visible
                bottomRightLogs.classList.remove("is-faded");
                resetLogFade();
                bottomRightLogs.appendChild(logLine);
                bottomRightLogs.scrollTop = bottomRightLogs.scrollHeight;
                logLine.className = "log-line";

                // keep log history bounded to avoid high memory/DOM usage
                while (bottomRightLogs.querySelectorAll(".log-line").length > 150) {
                    bottomRightLogs.removeChild(bottomRightLogs.querySelector(".log-line"));
                }
            }
        }

        window.addEventListener("rust-log", (event) => {
            handleLog(event.detail);
        });

        window.addEventListener("rust-crash", (event) => {
            showError("Rust Panic occurred:\n\n" + event.detail);
        });

        window.addEventListener("presented_first_frame", (event) => {
            if (!presentedFirstFrame) {
                presentedFirstFrame = true;
                loadingScreen.style.display = "none";
            }
        });

        (async () => {
            if (!navigator.gpu) {
                console.error("WebGPU not supported!");
                showError(`WebGPU isn't supported in this browser (or it's not enabled). Try Chrome 113+, Safari 26+ or Firefox 145+.`);
                return;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    showError("WebGPU is supported, but no suitable adapter was found on this device.");
                    return;
                }

                await init();
            } catch (error) {
                console.error("Initialization failed:", error);
                showError(error.message || error);
                return;
            }
        })();
    </script>
</body>

</html>
